---
# =============================================================================
# ONLYOFFICE Document Server — Default Variables
# =============================================================================
# Override these in inventory/group_vars/all.yml or via Ansible Vault.
# JWT secret MUST match the Seafile seahub_settings.py configuration.
# =============================================================================

# -- Deployment paths --------------------------------------------------------
onlyoffice_install_path: /opt/onlyoffice

# -- Networking --------------------------------------------------------------
# Internal port the Document Server listens on (Caddy proxies to this).
# No host ports are exposed; traffic flows: Caddy (443) → proxy-net → 8083.
onlyoffice_internal_port: 8083

# -- Domain ------------------------------------------------------------------
onlyoffice_domain: office.suitit.nl

# -- JWT / Seafile Integration -----------------------------------------------
# The JWT secret is shared between ONLYOFFICE and Seafile.  Both services
# must use the exact same value, otherwise document editing will fail with
# a "token not valid" error.
#
# In Seafile's seahub_settings.py you would set:
#   ONLYOFFICE_JWT_SECRET = '<same value as below>'
#
# For production, store this in Ansible Vault:
#   ansible-vault encrypt_string 'your-secret' --name 'onlyoffice_jwt_secret'
onlyoffice_jwt_enabled: "true"
onlyoffice_jwt_secret: "Ge5ZjCnz0shUsZXQEsv8qqtHopOFcZSxz9wMqUF-zvE"

# -- Keycloak / OIDC (documentation only) ------------------------------------
# The ONLYOFFICE Document Server (Community Edition) does NOT handle user
# authentication itself.  Authentication is managed by the frontend
# application that embeds the editor (in our case, Seafile).
#
# The actual auth flow is:
#   1. User visits files.suitit.nl (Seafile)
#   2. Seafile redirects unauthenticated users to Keycloak (OIDC)
#   3. Keycloak authenticates the user and returns a token to Seafile
#   4. Seafile opens the document in an ONLYOFFICE iframe
#   5. Seafile ↔ ONLYOFFICE communication is secured by the JWT secret above
#
# These variables are kept here for reference / future Enterprise Edition use:
keycloak_base_url: "https://auth.suitit.nl"
keycloak_realm: suitit
keycloak_oidc_issuer: "{{ keycloak_base_url }}/realms/{{ keycloak_realm }}"

# -- Container image ---------------------------------------------------------
onlyoffice_image: "onlyoffice/documentserver:latest"

# -- Timezone (matches mailcow_tz in group_vars/all.yml) ---------------------
onlyoffice_tz: Europe/Amsterdam
