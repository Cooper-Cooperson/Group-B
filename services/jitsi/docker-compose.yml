services:
  jitsi-web:
    image: jitsi/web:stable-9220
    restart: unless-stopped
    environment:
      - PUBLIC_URL=https://meet.suitit.tech
      - DISABLE_HTTPS=1
      - XMPP_SERVER=prosody
      - XMPP_BOSH_URL_BASE=https://meet.suitit.tech
      - JICOFO_AUTH_USER=focus
      - TZ=Europe/Amsterdam
    volumes:
      - jitsi_web_config:/config
    networks:
      proxy-net:
        aliases:
          - jitsi-web
      jitsi-net:

  prosody:
    image: jitsi/prosody:stable-9220
    restart: unless-stopped
    environment:
      - XMPP_DOMAIN=meet.suitit.tech
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - TZ=Europe/Amsterdam
    volumes:
      - prosody_config:/config
    networks:
      proxy-net:
        aliases:
          - prosody
      jitsi-net:

  jicofo:
    image: jitsi/jicofo:stable-9220
    restart: unless-stopped
    environment:
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=meet.suitit.tech
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - TZ=Europe/Amsterdam
    networks:
      - jitsi-net

  jvb:
    image: jitsi/jvb:stable-9220
    restart: unless-stopped
    ports:
      - "10000:10000/udp"
    environment:
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=meet.suitit.tech
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - DOCKER_HOST_ADDRESS=${DOCKER_HOST_ADDRESS}
      - TZ=Europe/Amsterdam
    networks:
      - jitsi-net

  jitsi-oauth-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}"
      OAUTH2_PROXY_CLIENT_ID: "${JITSI_OIDC_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${JITSI_OIDC_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${JITSI_OAUTH2_COOKIE_SECRET}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4181"
      OAUTH2_PROXY_REDIRECT_URL: "https://meet.suitit.tech/oauth2/callback"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_UPSTREAMS: "http://jitsi-web:80"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
    networks:
      proxy-net:
        aliases:
          - jitsi-oauth-proxy

volumes:
  jitsi_web_config:
  prosody_config:

networks:
  proxy-net:
    external: true
  jitsi-net:
    driver: bridge
